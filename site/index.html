<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microdrip — coming soon</title>
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <style>
    :root {
      color-scheme: light;
      --ink: #33363c;
      --muted: #8d8f90;
      --teal: #15b3ad;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--paper);
    }

    body {
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    [data-stage] {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.25rem, 4vw, 3rem);
      background:
        radial-gradient(ellipse 42% 36% at 50% 48%, rgba(21, 179, 173, 0.07), transparent 72%),
        linear-gradient(180deg, #ffffff 0%, #f4fbfb 100%);
    }

    .teaser {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(1.15rem, 3vw, 1.75rem);
      max-width: 100%;
    }

    .soon {
      margin: 0;
      color: var(--teal);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 0.42em;
      width: max-content;
      max-width: 100%;
      font-size: clamp(2.65rem, 7.4vw, 5.15rem);
    }

    .mark {
      height: 1.48em;
      width: auto;
      flex: none;
    }

    h1 {
      margin: 0;
      font-size: 1em;
      line-height: 0.86;
      font-weight: 700;
      letter-spacing: -0.045em;
    }

    .tag {
      margin: 0.42em 0 0;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.2em;
      font-size: 0.3em;
    }

    @media (max-width: 520px) {
      .soon { letter-spacing: 0.18em; font-size: 0.7rem; }
      .lockup { font-size: clamp(2.05rem, 10.2vw, 2.55rem); }
      .tag { letter-spacing: 0.1em; }
    }
  </style>
</head>
<body>
  <main data-stage>
    <div class="teaser">
      <p class="soon">Coming soon</p>
      <div class="lockup">
        <img class="mark" src="mark.png" alt="" width="181" height="368">
        <div class="words">
          <h1>Microdrip</h1>
          <p class="tag">Agent payments</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
